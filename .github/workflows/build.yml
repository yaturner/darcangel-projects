name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *" # nightly, picks up README changes in the project repos
  workflow_dispatch:
  repository_dispatch:
    types: [readme-updated] # fired by the project repos on README changes

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/configure-pages@v5
        with:
          enablement: true # turn Pages on (Actions source) on first run
      # `npm ci` needs a committed package-lock.json; `npm install` works either
      # way. Once you commit a lockfile you can switch this to `npm ci` and add
      # `cache: npm` to setup-node above.
      - run: npm install
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
